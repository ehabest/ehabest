<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="100%">
  <defs>
    <!-- Dark Background Gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#101b3b" />
      <stop offset="100%" stop-color="#070c1b" />
    </linearGradient>

    <!-- Glowing Blue Card Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Laser Line Gradient -->
    <linearGradient id="laser-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#60a5fa" stop-opacity="1" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="strong-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="3" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .step-card {
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .step-card:hover {
      filter: url(#strong-glow);
    }
    .laser-track {
      stroke: #1e3a8a;
      stroke-width: 4;
      stroke-dasharray: 8 6;
    }
    .laser-pulse {
      stroke: #60a5fa;
      stroke-width: 4;
      stroke-dasharray: 100 400;
      animation: movePulse 4s linear infinite;
      filter: url(#glow);
    }
    .node-dot {
      animation: pulseDot 2s ease-in-out infinite alternate;
    }
    @keyframes movePulse {
      0% { stroke-dashoffset: 500; }
      100% { stroke-dashoffset: -500; }
    }
    @keyframes pulseDot {
      0% { transform: scale(0.9); opacity: 0.7; }
      100% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 6px #60a5fa); }
    }
    .step-text {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 700;
      fill: #ffffff;
      font-size: 13px;
    }
    .sub-text {
      font-family: 'Fira Code', monospace, sans-serif;
      font-weight: 500;
      fill: #93c5fd;
      font-size: 11px;
    }
    .num-badge {
      font-family: 'Fira Code', monospace;
      font-weight: 800;
      fill: #3b82f6;
      font-size: 11px;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="240" rx="16" fill="url(#bg-gradient)" stroke="#1e293b" stroke-width="2" />

  <!-- Connecting Pipeline Tracks -->
  <line x1="75" y1="120" x2="1125" y2="120" class="laser-track" />
  <line x1="75" y1="120" x2="1125" y2="120" class="laser-pulse" />

  <!-- STEP 1: Photo Design -->
  <g class="step-card" transform="translate(30, 45)">
    <rect width="115" height="150" rx="12" fill="url(#card-grad)" stroke="#3b82f6" stroke-width="1.5" />
    <circle cx="57.5" cy="35" r="20" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5" />
    <text x="57.5" y="40" text-anchor="middle" class="num-badge">01</text>
    <!-- Photo Icon -->
    <path d="M47 68 h21 a2 2 0 0 1 2 2 v14 a2 2 0 0 1 -2 2 h-21 a2 2 0 0 1 -2 -2 v-14 a2 2 0 0 1 2 -2 z M52 74 a2.5 2.5 0 1 0 0 -5 a2.5 2.5 0 1 0 0 5 z" fill="none" stroke="#60a5fa" stroke-width="1.8" />
    <text x="57.5" y="108" text-anchor="middle" class="step-text">Photo Design</text>
    <text x="57.5" y="125" text-anchor="middle" class="sub-text">Photoshop</text>
  </g>

  <!-- STEP 2: Web Design -->
  <g class="step-card" transform="translate(175, 45)">
    <rect width="115" height="150" rx="12" fill="url(#card-grad)" stroke="#3b82f6" stroke-width="1.5" />
    <circle cx="57.5" cy="35" r="20" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5" />
    <text x="57.5" y="40" text-anchor="middle" class="num-badge">02</text>
    <!-- Web Design Icon -->
    <rect x="44" y="66" width="27" height="18" rx="2" fill="none" stroke="#60a5fa" stroke-width="1.8" />
    <line x1="44" y1="72" x2="71" y2="72" stroke="#60a5fa" stroke-width="1.5" />
    <text x="57.5" y="108" text-anchor="middle" class="step-text">Web Design</text>
    <text x="57.5" y="125" text-anchor="middle" class="sub-text">UI/UX Layout</text>
  </g>

  <!-- STEP 3: Responsive Design -->
  <g class="step-card" transform="translate(320, 45)">
    <rect width="115" height="150" rx="12" fill="url(#card-grad)" stroke="#3b82f6" stroke-width="1.5" />
    <circle cx="57.5" cy="35" r="20" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5" />
    <text x="57.5" y="40" text-anchor="middle" class="num-badge">03</text>
    <!-- Mobile/Responsive Icon -->
    <rect x="47" y="65" width="12" height="20" rx="2" fill="none" stroke="#60a5fa" stroke-width="1.8" />
    <rect x="62" y="70" width="8" height="15" rx="1" fill="none" stroke="#93c5fd" stroke-width="1.5" />
    <text x="57.5" y="108" text-anchor="middle" class="step-text">Responsive</text>
    <text x="57.5" y="125" text-anchor="middle" class="sub-text">HTML/CSS/JS</text>
  </g>

  <!-- STEP 4: Core PHP -->
  <g class="step-card" transform="translate(465, 45)">
    <rect width="125" height="150" rx="12" fill="url(#card-grad)" stroke="#a855f7" stroke-width="2" filter="url(#glow)" />
    <circle cx="62.5" cy="35" r="20" fill="#2e1065" stroke="#c084fc" stroke-width="2" />
    <text x="62.5" y="40" text-anchor="middle" class="num-badge" fill="#c084fc">04</text>
    <!-- PHP Lightning Icon -->
    <path d="M64 63 l-8 12 h7 l-3 11 l11 -13 h-7 z" fill="#c084fc" stroke="#e9d5ff" stroke-width="0.8" />
    <text x="62.5" y="108" text-anchor="middle" class="step-text" fill="#f3e8ff">Core PHP</text>
    <text x="62.5" y="125" text-anchor="middle" class="sub-text" fill="#c084fc">Engine Dev</text>
  </g>

  <!-- STEP 5: MySQL -->
  <g class="step-card" transform="translate(610, 45)">
    <rect width="115" height="150" rx="12" fill="url(#card-grad)" stroke="#3b82f6" stroke-width="1.5" />
    <circle cx="57.5" cy="35" r="20" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5" />
    <text x="57.5" y="40" text-anchor="middle" class="num-badge">05</text>
    <!-- DB Icon -->
    <ellipse cx="57.5" cy="67" rx="12" ry="4" fill="none" stroke="#60a5fa" stroke-width="1.5" />
    <path d="M45.5 67 v12 c0 2.2 5.4 4 12 4 s12 -1.8 12 -4 v-12" fill="none" stroke="#60a5fa" stroke-width="1.5" />
    <text x="57.5" y="108" text-anchor="middle" class="step-text">MySQL DB</text>
    <text x="57.5" y="125" text-anchor="middle" class="sub-text">Architecture</text>
  </g>

  <!-- STEP 6: Web Hosting -->
  <g class="step-card" transform="translate(755, 45)">
    <rect width="115" height="150" rx="12" fill="url(#card-grad)" stroke="#3b82f6" stroke-width="1.5" />
    <circle cx="57.5" cy="35" r="20" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5" />
    <text x="57.5" y="40" text-anchor="middle" class="num-badge">06</text>
    <!-- Server Cloud Icon -->
    <path d="M46 78 a6 6 0 0 1 2 -11.6 a9 9 0 0 1 17 -2 a6 6 0 0 1 3 11.6 z" fill="none" stroke="#60a5fa" stroke-width="1.6" />
    <text x="57.5" y="108" text-anchor="middle" class="step-text">Web Hosting</text>
    <text x="57.5" y="125" text-anchor="middle" class="sub-text">Server Setup</text>
  </g>

  <!-- STEP 7: SEO -->
  <g class="step-card" transform="translate(900, 45)">
    <rect width="115" height="150" rx="12" fill="url(#card-grad)" stroke="#3b82f6" stroke-width="1.5" />
    <circle cx="57.5" cy="35" r="20" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5" />
    <text x="57.5" y="40" text-anchor="middle" class="num-badge">07</text>
    <!-- SEO Search/Growth Icon -->
    <path d="M46 78 l6 -8 l5 4 l8 -10" fill="none" stroke="#60a5fa" stroke-width="1.8" stroke-linecap="round" />
    <text x="57.5" y="108" text-anchor="middle" class="step-text">SEO Engine</text>
    <text x="57.5" y="125" text-anchor="middle" class="sub-text">Meta Tags</text>
  </g>

  <!-- STEP 8: Analytics -->
  <g class="step-card" transform="translate(1045, 45)">
    <rect width="120" height="150" rx="12" fill="url(#card-grad)" stroke="#10b981" stroke-width="1.8" filter="url(#glow)" />
    <circle cx="60" cy="35" r="20" fill="#064e3b" stroke="#34d399" stroke-width="1.8" />
    <text x="60" y="40" text-anchor="middle" class="num-badge" fill="#34d399">08</text>
    <!-- Chart Icon -->
    <rect x="47" y="72" width="5" height="10" fill="#34d399" />
    <rect x="55" y="66" width="5" height="16" fill="#34d399" />
    <rect x="63" y="62" width="5" height="20" fill="#34d399" />
    <text x="60" y="108" text-anchor="middle" class="step-text" fill="#ecfdf5">Analytics</text>
    <text x="60" y="125" text-anchor="middle" class="sub-text" fill="#34d399">Google Traffic</text>
  </g>
</svg>
