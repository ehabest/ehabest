<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" width="1600" height="420" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Ihab Elkady - Senior Web Designer and PHP Developer</title>
<desc id="d">Animated banner with a code window and rotating job titles</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#0b1f3a"/><stop offset="0.55" stop-color="#102C57"/><stop offset="1" stop-color="#1d4f91"/>
</linearGradient>
<linearGradient id="nm" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#9cc7ff"/>
</linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
<path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
</pattern>
</defs>
<style>
text{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.mono{font-family:Consolas,'Courier New',monospace}
.orb{animation:drift 14s ease-in-out infinite alternate}
.o2{animation-duration:18s;animation-delay:-4s}
.o3{animation-duration:11s;animation-delay:-7s}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(60px,-30px)}}
.sym{animation:floaty 6s ease-in-out infinite alternate;fill:#9cc7ff;opacity:.35}
.y2{animation-duration:8s;animation-delay:-2s}.y3{animation-duration:7s;animation-delay:-4s}
@keyframes floaty{from{transform:translateY(0)}to{transform:translateY(-18px)}}
.sub{opacity:0;animation:show 9s infinite}
.s2{animation-delay:3s}.s3{animation-delay:6s}
@keyframes show{0%{opacity:0;transform:translateY(8px)}4%,30%{opacity:1;transform:translateY(0)}33%,100%{opacity:0}}
.ln{opacity:0;animation:line 10s infinite both}
.l2{animation-delay:.8s}.l3{animation-delay:1.6s}.l4{animation-delay:2.4s}
@keyframes line{0%{opacity:0}8%,88%{opacity:1}100%{opacity:0}}
.cur{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.sub{opacity:0}.s1{opacity:1}.ln{opacity:1}}
</style>
<rect width="1600" height="420" fill="url(#bg)"/>
<rect width="1600" height="420" fill="url(#grid)"/>
<circle class="orb" cx="260" cy="110" r="170" fill="#3B82F6" opacity=".16"/>
<circle class="orb o2" cx="1180" cy="330" r="200" fill="#22d3ee" opacity=".10"/>
<circle class="orb o3" cx="760" cy="60" r="110" fill="#8b5cf6" opacity=".14"/>
<text class="sym mono" x="640" y="120" font-size="54">&lt;/&gt;</text>
<text class="sym mono y2" x="880" y="330" font-size="46">{ }</text>
<text class="sym mono y3" x="60" y="360" font-size="40">;</text>
<text x="100" y="175" font-size="88" font-weight="700" fill="url(#nm)">Ihab Elkady</text>
<g font-size="36" fill="#cfe3ff">
<text class="sub s1" x="104" y="238">Senior Web Designer</text>
<text class="sub s2" x="104" y="238">Core PHP &amp; Frontend Developer</text>
<text class="sub s3" x="104" y="238">14+ years building for the web</text>
</g>
<g font-size="20" font-weight="600" fill="#ffffff">
<rect x="100" y="278" width="78" height="38" rx="19" fill="#ffffff" fill-opacity=".14"/><text x="139" y="303" text-anchor="middle">PHP</text>
<rect x="190" y="278" width="96" height="38" rx="19" fill="#ffffff" fill-opacity=".14"/><text x="238" y="303" text-anchor="middle">MySQL</text>
<rect x="298" y="278" width="128" height="38" rx="19" fill="#ffffff" fill-opacity=".14"/><text x="362" y="303" text-anchor="middle">JavaScript</text>
<rect x="438" y="278" width="92" height="38" rx="19" fill="#ffffff" fill-opacity=".14"/><text x="484" y="303" text-anchor="middle">HTML5</text>
<rect x="542" y="278" width="78" height="38" rx="19" fill="#ffffff" fill-opacity=".14"/><text x="581" y="303" text-anchor="middle">CSS3</text>
</g>
<g>
<rect x="1010" y="70" width="500" height="230" rx="16" fill="#0a1628" fill-opacity=".85" stroke="#ffffff" stroke-opacity=".15"/>
<circle cx="1038" cy="96" r="7" fill="#ff5f56"/><circle cx="1060" cy="96" r="7" fill="#ffbd2e"/><circle cx="1082" cy="96" r="7" fill="#27c93f"/>
<g class="mono" font-size="24">
<text class="ln" x="1040" y="152" fill="#f78c6c">&lt;?php</text>
<text class="ln l2" x="1040" y="190"><tspan fill="#82aaff">$name</tspan><tspan fill="#ffffff"> = </tspan><tspan fill="#c3e88d">"Ihab Elkady"</tspan><tspan fill="#ffffff">;</tspan></text>
<text class="ln l3" x="1040" y="228"><tspan fill="#82aaff">$from</tspan><tspan fill="#ffffff"> = </tspan><tspan fill="#c3e88d">"Egypt"</tspan><tspan fill="#ffffff">;</tspan></text>
<text class="ln l4" x="1040" y="266"><tspan fill="#c792ea">echo</tspan><tspan fill="#c3e88d"> "Hello, GitHub!"</tspan><tspan fill="#ffffff">;</tspan><tspan class="cur" fill="#9cc7ff"> |</tspan></text>
</g>
</g>
<path fill="#ffffff" fill-opacity=".07" d="M0 372 Q200 342 400 372 T800 372 T1200 372 T1600 372 T2000 372 T2400 372 T2800 372 T3200 372 V420 H0 Z">
<animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="14s" repeatCount="indefinite"/>
</path>
<path fill="#ffffff" fill-opacity=".10" d="M0 392 Q200 366 400 392 T800 392 T1200 392 T1600 392 T2000 392 T2400 392 T2800 392 T3200 392 V420 H0 Z">
<animateTransform attributeName="transform" type="translate" from="-800 0" to="0 0" dur="10s" repeatCount="indefinite"/>
</path>
</svg>
