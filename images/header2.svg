<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650" role="img" aria-labelledby="title desc">
<title id="title">Eng. Ihab Elkady — Senior Web Designer and PHP Developer</title><desc id="desc">Animated navy and electric-blue technical banner with code-inspired details.</desc>
<style>
.mono{font-family:'JetBrains Mono','Fira Code',Consolas,monospace}.sans{font-family:Inter,'Segoe UI',Arial,sans-serif}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(22px,-16px)}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes dash{to{stroke-dashoffset:-240}}@keyframes scan{0%{transform:translateY(-700px)}100%{transform:translateY(700px)}}@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}@keyframes blink{50%{opacity:0}}
.orb{animation:drift 12s ease-in-out infinite}.orb2{animation:drift 15s ease-in-out infinite reverse}.pulse{animation:pulse 2s ease-in-out infinite}.flow{stroke-dasharray:5 10;animation:dash 9s linear infinite}.scan{animation:scan 9s linear infinite}.a1{animation:rise .8s ease-out .1s both}.a2{animation:rise .8s ease-out .35s both}.a3{animation:rise .8s ease-out .6s both}.cursor{animation:blink 1s step-end infinite}
</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070B14"/><stop offset="1" stop-color="#101D35"/></linearGradient><linearGradient id="title" x1="0" x2="1"><stop stop-color="#FFFFFF"/><stop offset=".62" stop-color="#C9E8FF"/><stop offset="1" stop-color="#38BDF8"/></linearGradient><radialGradient id="glow"><stop stop-color="#168BFF" stop-opacity=".35"/><stop offset="1" stop-color="#168BFF" stop-opacity="0"/></radialGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#9CCBFF" stroke-opacity=".07"/></pattern><linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#38BDF8" stop-opacity="0"/><stop offset=".5" stop-color="#38BDF8" stop-opacity=".09"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="650" rx="30" fill="url(#bg)"/><rect width="1600" height="650" rx="30" fill="url(#grid)"/><circle class="orb" cx="1320" cy="250" r="380" fill="url(#glow)">
<animateTransform attributeName="transform" type="translate" values="0 0;22 -16;0 0" dur="12s" repeatCount="indefinite"/>
</circle><circle class="orb2" cx="250" cy="650" r="300" fill="url(#glow)">
<animateTransform attributeName="transform" type="translate" values="0 0;-18 12;0 0" dur="15s" repeatCount="indefinite"/>
</circle>
<g fill="none" stroke="#38BDF8" stroke-opacity=".28" stroke-width="2"><path class="flow" d="M870 150H1050V215H1170V140H1450"/><path class="flow" d="M850 510H1020V445H1170V510H1510"/><path d="M1120 300h100l32 32h95"/><path d="M1260 365h-65l-24 24h-100"/></g>
<g fill="#38BDF8"><circle class="pulse" cx="1050" cy="150" r="5"/><circle class="pulse" cx="1170" cy="215" r="5"/><circle class="pulse" cx="1320" cy="332" r="5"/><circle class="pulse" cx="1020" cy="445" r="5"/><circle class="pulse" cx="1170" cy="510" r="5"/></g>
<g class="mono" font-size="16" fill="#8CA7C8"><text x="64" y="60">EHABEST / ENGINEERING PORTFOLIO</text><text x="1536" y="60" text-anchor="end">KUWAIT · EGYPT · WEB ENGINEERING</text></g><line x1="64" y1="82" x2="1536" y2="82" stroke="#8CA7C8" stroke-opacity=".2"/>
<g class="sans"><text class="mono a1" x="78" y="180" font-size="20" fill="#38BDF8" letter-spacing="5">// HELLO, I'M</text><text class="a2" x="70" y="280" font-size="82" font-weight="800" letter-spacing="-2" fill="url(#title)">ENG. IHAB ELKADY</text><rect x="80" y="316" width="5" height="70" rx="2" fill="#38BDF8"/><text class="a3" x="106" y="347" font-size="29" font-weight="650" fill="#F1F7FF">Senior Web Designer <tspan fill="#64748B">|</tspan> Core PHP Developer</text><text class="a3" x="106" y="385" font-size="22" fill="#9DB3D0">Computer &amp; Software Engineer · UI/UX · High-performance web platforms</text><g class="mono a3" font-size="16"><rect x="80" y="430" width="160" height="42" rx="21" fill="#38BDF8" fill-opacity=".10" stroke="#38BDF8" stroke-opacity=".6"/><text x="160" y="456" fill="#BCEBFF" text-anchor="middle">CORE PHP</text><rect x="254" y="430" width="150" height="42" rx="21" fill="#38BDF8" fill-opacity=".10" stroke="#38BDF8" stroke-opacity=".6"/><text x="329" y="456" fill="#BCEBFF" text-anchor="middle">MYSQL</text><rect x="418" y="430" width="180" height="42" rx="21" fill="#38BDF8" fill-opacity=".10" stroke="#38BDF8" stroke-opacity=".6"/><text x="508" y="456" fill="#BCEBFF" text-anchor="middle">UI / UX DESIGN</text></g><text class="mono a3" x="80" y="540" font-size="18" fill="#7894B8">$ build --fast --accessible --responsive <tspan class="cursor" fill="#38BDF8">▍</tspan></text></g>
<g transform="translate(1240 260)"><circle r="150" fill="none" stroke="#38BDF8" stroke-opacity=".22" stroke-width="1.5"/><circle r="118" fill="none" stroke="#38BDF8" stroke-opacity=".42" stroke-dasharray="3 10"/><circle r="88" fill="#0B172A" stroke="#38BDF8" stroke-opacity=".7" stroke-width="2"/><text class="mono" x="0" y="-7" font-size="34" text-anchor="middle" fill="#E6F7FF">&lt;?php</text><text class="mono" x="0" y="27" font-size="17" text-anchor="middle" fill="#38BDF8">ENGINEER</text><circle class="pulse" cx="0" cy="-150" r="5" fill="#38BDF8"/><circle class="pulse" cx="150" cy="0" r="5" fill="#38BDF8"/><circle class="pulse" cx="-105" cy="105" r="5" fill="#38BDF8"/></g>
<rect class="scan" x="0" y="-700" width="1600" height="700" fill="url(#scanG)"><animate attributeName="y" values="-700;700" dur="9s" repeatCount="indefinite"/></rect><rect x="1" y="1" width="1598" height="648" rx="29" fill="none" stroke="#9CCBFF" stroke-opacity=".18"/>
</svg>
